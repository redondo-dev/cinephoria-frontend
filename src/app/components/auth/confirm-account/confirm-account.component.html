<div class="confirm-container">
  <div *ngIf="status === 'loading'">
    <p>Confirmation de votre compte en cours...</p>
  </div>

  <div *ngIf="status === 'success'">
    <h2>✅ {{ message }}</h2>
    <button (click)="goToLogin()">Se connecter</button>
  </div>

  <div *ngIf="status === 'error'">
    <h2>❌ {{ message }}</h2>
    <button (click)="goToLogin()">Retour à la connexion</button>
  </div>
</div>
